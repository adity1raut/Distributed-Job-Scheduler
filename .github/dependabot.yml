version: 2

updates:
  # Grouped so a week of patch bumps arrives as one reviewable PR rather than
  # twenty that each need CI to run.
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /ui-interface
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Base images carry most of the CVEs Trivy reports, and they are the easiest
  # to bump — worth their own schedule.
  - package-ecosystem: docker
    directories:
      - /server
      - /ui-interface
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"

  # Pinned action versions go stale silently and are a supply-chain risk.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

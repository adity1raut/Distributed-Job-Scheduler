name: CD

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [staging, production]
        default: staging

# Never two deploys at once, and never cancel one midway: an interrupted
# deploy can leave the fleet on mixed versions.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: ./server
          - name: web
            context: ./ui-interface

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          # Immutable sha tag on every build is what deployments actually
          # reference; `latest` moves and must never be used to pin a rollback.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=job-scheduler-${{ matrix.name }}
            org.opencontainers.image.description=Distributed job scheduler (${{ matrix.name }})

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # arm64 as well as amd64: Graviton and Apple Silicon hosts are common
          # enough that an amd64-only image is a deployment trap.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      # Signed proof of which workflow run produced this digest, so a
      # deployed image can be traced back to its source commit.
      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    needs: build
    # Bind to a GitHub Environment so protection rules apply: required
    # reviewers on production, and the secrets below scoped per environment.
    environment:
      name: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v4

      # Skips cleanly when the environment has no host configured, so the
      # workflow is useful before any server exists.
      - name: Check deployment target
        id: target
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::notice::No DEPLOY_HOST configured for this environment — publishing images only."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy deployment files to host
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,server/migrations/*,deploy/scripts/*"
          target: ${{ vars.DEPLOY_PATH || '/opt/job-scheduler' }}

      - name: Roll out
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build.outputs.version }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/opt/job-scheduler' }}"

            # Record what is running now, so the rollback step below has
            # something concrete to go back to.
            if [ -f .env ]; then
              grep -E '^IMAGE_TAG=' .env > .env.previous-tag || true
            fi

            # .env lives on the host and holds the real secrets; CI only ever
            # rewrites the image tag in it.
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            # Migrations first and on their own: they must succeed before any
            # new application container starts, and a failure here should stop
            # the deploy rather than crash-loop the API.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait --wait-timeout 180
            docker image prune -f --filter "until=168h"

      - name: Smoke test the deployment
        if: steps.target.outputs.configured == 'true'
        run: ./deploy/scripts/smoke-test.sh "${{ vars.DEPLOY_URL }}"
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_TIMEOUT: "90"

      # A deploy that passes health checks but cannot run a job is still a
      # failed deploy — put the previous tag back rather than leave it broken.
      - name: Roll back on failure
        if: failure() && steps.target.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/opt/job-scheduler' }}"
            if [ -s .env.previous-tag ]; then
              previous="$(cut -d= -f2 .env.previous-tag)"
              echo "Rolling back to ${previous}"
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${previous}|" .env
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait --wait-timeout 180
            else
              echo "::error::No previous tag recorded — roll back manually."
              exit 1
            fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${{ needs.build.outputs.version }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Target configured | ${{ steps.target.outputs.configured }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

# Included rather than declared once at server level, because nginx's
# add_header is replace-not-merge: any location block that sets a single
# add_header of its own silently drops every header inherited from its
# parent. Every location that sets a header therefore includes this file.
#
# HSTS is deliberately absent: TLS terminates at the ingress or load balancer
# in front of this container, and that is where the header belongs. Setting
# it on a plain-HTTP upstream is at best a no-op.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# The app loads fonts from Google Fonts (see index.html) and its runtime
# config from its own origin. connect-src stays 'self' because the API is
# proxied under this same origin; widen it only if API_URL points elsewhere.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # config.js is regenerated per-container at startup (see
    # docker-entrypoint.d/40-render-config.sh) — never let a browser or CDN
    # cache a stale API URL from a previous deployment.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Hashed build assets (Vite fingerprints these) are safe to cache
    # aggressively — a new deploy ships a new filename, not new bytes
    # under an old one.
    location ~* \.(?:css|js|svg|woff2?|png|jpe?g|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React Router owns everything else client-side — fall back to
    # index.html so a hard refresh on e.g. /projects/{id} doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
